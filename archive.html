<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Архів дайджестів</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1c2230;--muted:#67748b;--accent:#2f6bdb;
--border:#e3e7ee;--up:#188a4b;--down:#cf3543;--chip:#edf1f9;--note:#f3f7ff;--noteb:#2f6bdb;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#161b23;
--text:#e7ebf2;--muted:#93a0b4;--accent:#6ea1ff;--border:#28303d;--chip:#1d2530;
--note:#18202e;--noteb:#6ea1ff;--up:#3fbf7a;--down:#ef6a75;}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#161b23;--text:#e7ebf2;--muted:#93a0b4;
--accent:#6ea1ff;--border:#28303d;--chip:#1d2530;--note:#18202e;--noteb:#6ea1ff;
--up:#3fbf7a;--down:#ef6a75;}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);margin:0;padding:22px 14px 40px;
font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:780px;margin:0 auto;}
h1{font-size:1.45rem;margin:0 0 2px;text-wrap:balance;}
.date{color:var(--muted);font-size:.9rem;margin-bottom:14px;}
.prices{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
.prices span{background:var(--chip);border:1px solid var(--border);border-radius:999px;
padding:5px 13px;font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums;}
.up{color:var(--up);font-weight:650;}.down{color:var(--down);font-weight:650;}
nav.toc{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px;}
nav.toc a{background:var(--card);border:1px solid var(--border);border-radius:999px;
padding:5px 12px;font-size:.83rem;color:var(--text);text-decoration:none;}
nav.toc a:hover{border-color:var(--accent);color:var(--accent);}
nav.toc a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
section{background:var(--card);border:1px solid var(--border);border-radius:16px;
padding:16px 18px;margin-bottom:16px;scroll-margin-top:12px;}
h2{font-size:1.08rem;margin:0 0 6px;text-wrap:balance;}
h2 .cnt{color:var(--muted);font-weight:400;font-size:.8rem;}
ul.tldr{margin:6px 0 0;padding-left:20px;}
ul.tldr li{margin-bottom:10px;}
details{border-top:1px solid var(--border);}
details:first-of-type{border-top:none;}
summary{cursor:pointer;font-weight:600;line-height:1.5;list-style:none;
padding:12px 4px 12px 22px;position:relative;border-radius:8px;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\25B8";position:absolute;left:2px;top:12px;color:var(--accent);
transition:transform .15s ease;}
details[open] summary::before{transform:rotate(90deg);}
summary:hover{color:var(--accent);}
summary .tag{color:var(--muted);font-weight:400;font-size:.78rem;white-space:nowrap;}
.body{margin:0 0 8px;padding:0 4px 0 22px;}
.note{margin:8px 0 8px 22px;padding:9px 12px 9px 14px;background:var(--note);
border-left:3px solid var(--noteb);border-radius:0 10px 10px 0;font-size:.94rem;}
.note b{color:var(--accent);}
.src{font-size:.84rem;margin:0 0 12px;padding:0 4px 0 22px;color:var(--muted);}
.src a{color:var(--accent);text-decoration:none;}
.src a:hover{text-decoration:underline;}
footer{color:var(--muted);font-size:.8rem;margin-top:16px;line-height:1.55;}
footer a{color:var(--accent);text-decoration:none;}
@media (prefers-reduced-motion: reduce){summary::before{transition:none;}}

.sitenav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
padding:9px 14px;margin:-22px -14px 18px;background:var(--card);border-bottom:1px solid var(--border);
backdrop-filter:saturate(150%) blur(8px);}
.sitenav a{font-size:.85rem;text-decoration:none;color:var(--muted);padding:5px 11px;border-radius:999px;
border:1px solid transparent;white-space:nowrap;}
.sitenav a:hover{color:var(--accent);border-color:var(--border);}
.sitenav a.on{color:var(--accent);border-color:var(--accent);font-weight:600;}
.sitenav .sp{flex:1;}
</style>
</head>
